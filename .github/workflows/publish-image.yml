name: Publish Go API image

on:
  push:
    branches: [main, master, codex/blog-api]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-go-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'hideInEye/website-go'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hideineye/sunset-footprints-api-go:deploy
            ghcr.io/hideineye/sunset-footprints-api-go:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
