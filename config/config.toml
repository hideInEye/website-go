# 运行模式(debug:调试,test:测试,release:正式)
run_mode = "debug"

# casbin模型配置文件(也可以启动服务时使用-m指定)
casbin_model_conf = ""

# 静态站点目录(也可以启动服务时使用-www指定)
www = ""

# swagger文档目录(也可以启动服务时使用-swagger指定)
swagger = ""

# 数据存储(支持：gorm)
store = "gorm"

# 是否允许初始化菜单数据(检查当前数据库中是否存在菜单数据，如果不存在则执行数据初始化)
allow_init_menu = false

# 是否启用casbin鉴权
enable_casbin = false

# http配置
[http]
# http监听地址
host = "0.0.0.0"
# http监听端口
port = 4000
# http优雅关闭等待超时时长(单位秒)
shutdown_timeout = 30

# 可信反向代理地址；生产环境按实际 Docker 网段配置。
trusted_proxies = ["127.0.0.1/32", "::1/128"]

# 服务监控(GOPS:https://github.com/google/gops)
[monitor]
# 是否启用
enable = false
# HTTP的监听地址和端口
addr = "127.0.0.1:16060"
# 配置文件目录(为空则使用默认目录)
config_dir = ""

# 日志配置
[log]
# 日志级别(1:fatal 2:error,3:warn,4:info,5:debug)
level = 5
# 日志格式（支持输出格式：text/json）
format = "text"
# 日志输出(支持：stdout/stderr/file)
output = "stdout"
# 指定日志输出的文件路径
output_file = "data/ginadmin.log"
# 是否启用日志钩子
enable_hook = false
# 日志钩子(支持：gorm)
hook = "gorm"
# 写入钩子的最大工作线程数量
hook_max_thread = 1
# 写入钩子的最大缓冲区数量
hook_max_buffer = 512

# minio存储
[minio]
addr = "127.0.0.1:9000"
assess_key = ""
secret_key = ""

# 沿用模板 assess_key 的拼写，填写已有 MinIO 账号。
bucket = "sunset-media"
use_ssl = false
request_timeout_ms = 5000

# gorm配置
[gorm]
# 是否开启调试模式
debug = false
# 数据库类型(目前支持的数据库类型：mysql/sqlite3/postgres)
db_type = "mysql"
# 设置连接可以重用的最长时间(单位：秒)
max_lifetime = 180
# 设置数据库的最大打开连接数
max_open_conns = 8
# 设置空闲连接池中的最大连接数
max_idle_conns = 2
# 数据库表名前缀
table_prefix = ""
# 是否开启自动映射数据库表结构
auto_migrate = false

# mysql数据库配置
[mysql]
# 连接地址
host = "127.0.0.1"
# 连接端口
port = 3306
# 用户名
user = ""
# 密码
password = ""
# 数据库
db_name = "sunset_blog"
# 连接参数
parameters = "charset=utf8mb4&parseTime=True&loc=UTC&timeout=5s&readTimeout=15s&writeTimeout=15s"

# sqlite数据库配置
[sqlite3]
# 数据库路径
path = "data/ginadmin.db"

# 图形验证码
[captcha]
# 存储方式(支持：memory/redis)
store = "memory"
# 数字长度
length = 4
# 图片宽度
width = 360
# 图片高度
height = 120
# redis数据库(如果存储方式是redis，则指定存储的数据库)
redis_db = 10
# 存储到redis数据库中的键名前缀
redis_prefix = "captcha_"

# redis配置
[redis]
# 当前站点业务不依赖 Redis；保留模板插件，默认不启动。
enable = false
# 地址
addr = "127.0.0.1:6379"
# 密码
password = ""
#指定数据库
db = 9

# 请求频率限制(如果redis可用则使用redis，否则使用内存存储)
[rate_limiter]
# 是否启用
enable = false
# 每分钟每个用户允许的最大请求数量
count = 300
# redis数据库(如果存储方式是redis，则指定存储的数据库)
redis_db = 10

# 用户认证(jwt)
[jwt_auth]
# 签名方式(支持：HS512/HS384/HS512)
signing_method = "HS512"
# 签名key
signing_key = "GINADMIN"
# 过期时间（单位秒）
expired = 7200
# 存储(支持：file/redis)
store = "file"
# 文件路径
file_path = "data/jwt_auth.db"
# redis数据库(如果存储方式是redis，则指定存储的数据库)
redis_db = 10
# 存储到redis数据库中的键名前缀
redis_prefix = "auth_"
# 三方Key
third_key = ""

# 刷新令牌天数与站点 Cookie 设置。
refresh_ttl_days = 30
cookie_secure = false

# 跨域请求
[cors]
# 是否启用
enable = false
# 允许跨域请求的域名列表(*表示全部允许)
allow_origins = ["*"]
# 允许跨域请求的请求方式列表
allow_methods = ["GET","POST","PUT","DELETE","PATCH"]
# 允许客户端与跨域请求一起使用的非简单标头的列表
allow_headers = []
# 请求是否可以包含cookie，HTTP身份验证或客户端SSL证书等用户凭据
allow_credentials = true
# 可以缓存预检请求结果的时间（以秒为单位）
max_age = 7200

# 高德地图
[amap]
#key = ""

[excel_export]
#导出文件


[upload]
# 上传文件前缀
prefix = "s"
# 上传大小限制(单位M)
size_limit = 64
# 允许的桶列表
buckets = ["assets"]

# root用户
[root]
# 登录用户名
user_name = "root"
# 登录密码
password = ""
# 显示的真实姓名
real_name = "超级管理员"

# 站点及媒体地址
[site]
origin = "http://localhost:3000"
allow_insecure_http = false

[media]
# 留空时生成 site.origin/media 代理地址，浏览器不访问 MinIO 内部主机名。
public_url = ""
upload_public_url = ""

[mail]
# log 仅把验证/重置链接写入服务日志；smtp 才实际发送邮件。
mode = "log"
host = "localhost"
port = 1025
user = ""
password = ""
from = "日落的足迹 <noreply@example.com>"
